ss="status-badge" rx="15"/><circle cx="15" cy="15" r="4.5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.4;1"/></circle><text x="30" y="19.5" fill="#94a3b8" class="mono" font-size="11" font-weight="600" letter-spacing="1">NEXT-GEN AI STORAGE &amp; INFERENCE</text></g><text x="80" y="132" fill="#fff" class="sans" font-size="44" font-weight="800" letter-spacing="-1">Awesome <tspan fill="url(#primaryGrad)">SSD Model Inference</tspan></text><text x="80" y="178" fill="#e2e8f0" class="sans" font-size="28" font-weight="700" letter-spacing="-.5">&amp; Fast Storage Systems</text><text x="80" y="218" fill="#94a3b8" class="sans" font-size="15" font-weight="400">Curated architecture of NVMe weight streaming, distributed KV-cache tiers, and high-throughput GPU serving runtimes.</text><g><g transform="translate(80, 252) translate(0, 0)"><rect width="180" height="36" fill="url(#cardBg)" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="22" fill="#38bdf8" class="mono" font-size="12" font-weight="600">⚡ NVMe IoRing / mmap</text></g><g transform="translate(80, 252) translate(192, 0)"><rect width="180" height="36" fill="url(#cardBg)" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="22" fill="#818cf8" class="mono" font-size="12" font-weight="600">💾 Tiered KV-Caching</text></g><g transform="translate(80, 252) translate(384, 0)"><rect width="180" height="36" fill="url(#cardBg)" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="22" fill="#c084fc" class="mono" font-size="12" font-weight="600">🚀 MoE SSD Offloading</text></g><g transform="translate(80, 252) translate(576, 0)"><rect width="195" height="36" fill="url(#cardBg)" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="22" fill="#fbbf24" class="mono" font-size="12" font-weight="600">🧩 Quantized Kernels</text></g></g><rect width="1200" height="4" x="0" y="356" fill="url(#primaryGrad)" rx="2"/></svg>