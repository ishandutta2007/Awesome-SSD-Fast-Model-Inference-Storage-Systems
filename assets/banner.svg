<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="40%" stop-color="#0d1124" />
      <stop offset="80%" stop-color="#141a36" />
      <stop offset="100%" stop-color="#0a0d1b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* Dynamic pulsing and streaming animations in the background */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes badgeGlow {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }

    .pulsing-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 80px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 8s ease-in-out infinite 2s;
      transform-origin: 1050px 280px;
    }
    .data-stream {
      stroke-dasharray: 12, 12;
      animation: streamFlow 12s linear infinite;
    }
    .data-stream-fast {
      stroke-dasharray: 8, 8;
      animation: streamFlow 6s linear infinite;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 3s; }
    .status-badge { animation: badgeGlow 3s ease-in-out infinite; }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Background Orbs (Behind Foreground Content) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.18" filter="url(#glow)" class="pulsing-orb-1" />
  <circle cx="1020" cy="260" r="160" fill="#818cf8" opacity="0.18" filter="url(#glow)" class="pulsing-orb-2" />
  <circle cx="600" cy="330" r="100" fill="#c084fc" opacity="0.12" filter="url(#glow)" />

  <!-- Animated Data Transmission Paths (Flow Lines) -->
  <g opacity="0.6">
    <path d="M -50 90 Q 300 30 650 90 T 1250 80" fill="none" stroke="url(#cyanGrad)" stroke-width="2" class="data-stream" />
    <path d="M -50 280 Q 400 340 850 280 T 1250 290" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="data-stream-fast" />
  </g>

  <!-- Ambient Floating Data Particles -->
  <circle cx="180" cy="180" r="3" fill="#38bdf8" class="particle-1" />
  <circle cx="340" cy="270" r="4" fill="#818cf8" class="particle-2" />
  <circle cx="980" cy="110" r="3.5" fill="#c084fc" class="particle-3" />
  <circle cx="820" cy="220" r="2.5" fill="#38bdf8" class="particle-1" />
  <circle cx="1060" cy="180" r="4" fill="#00f2fe" class="particle-2" />

  <!-- FOREGROUND CONTENT: Guaranteed High Contrast & Clarity -->
  
  <!-- Category Pill / Badge -->
  <g transform="translate(80, 48)">
    <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" class="status-badge" />
    <circle cx="15" cy="15" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="19.5" fill="#94a3b8" class="mono" font-size="11" font-weight="600" letter-spacing="1">NEXT-GEN AI STORAGE &amp; INFERENCE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="132" fill="#ffffff" class="sans" font-size="44" font-weight="800" letter-spacing="-1">
    Awesome <tspan fill="url(#primaryGrad)">SSD Model Inference</tspan>
  </text>
  <text x="80" y="178" fill="#e2e8f0" class="sans" font-size="28" font-weight="700" letter-spacing="-0.5">
    &amp; Fast Storage Systems
  </text>

  <!-- Subtitle / Meta Description -->
  <text x="80" y="218" fill="#94a3b8" class="sans" font-size="15" font-weight="400">
    Curated architecture of NVMe weight streaming, distributed KV-cache tiers, and high-throughput GPU serving runtimes.
  </text>

  <!-- Feature Tags / Tech Capabilities Pills -->
  <g transform="translate(80, 252)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#38bdf8" class="mono" font-size="12" font-weight="600">⚡ NVMe IoRing / mmap</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(192, 0)">
      <rect width="180" height="36" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#818cf8" class="mono" font-size="12" font-weight="600">💾 Tiered KV-Caching</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(384, 0)">
      <rect width="180" height="36" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#c084fc" class="mono" font-size="12" font-weight="600">🚀 MoE SSD Offloading</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(576, 0)">
      <rect width="195" height="36" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#fbbf24" class="mono" font-size="12" font-weight="600">🧩 Quantized Kernels</text>
    </g>
  </g>

  <!-- Subtle Bottom Decorative Border -->
  <rect x="0" y="356" width="1200" height="4" rx="2" fill="url(#primaryGrad)" />
</svg>
